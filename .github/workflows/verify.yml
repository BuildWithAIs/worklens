name: Verify desktop application
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --config.electronDist=node_modules/electron/dist
      - name: Packaged Windows smoke
        if: runner.os == 'Windows'
        env:
          WORKLENS_PACKAGED_EXE: release/win-unpacked/WorkLens.exe
        run: npx playwright test tests/e2e/packaged.spec.ts
      - name: Package macOS
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --config.electronDist=node_modules/electron/dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            test-results/
            release/*.exe
            release/*.dmg
