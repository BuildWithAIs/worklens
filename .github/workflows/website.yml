name: Website

on:
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: node --test website/worker.test.mjs
      - run: python -m unittest discover -s website -p '*_test.py'
      - run: python website/deploy.py --check
      - run: npx --yes wrangler@4.127.1 deploy --config website/wrangler.jsonc --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: website-production
      url: https://worklens.buildwithais.com/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r website/requirements.txt
      - name: Upload, verify and activate R2 release
        run: python website/deploy.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.WORKLENS_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WORKLENS_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          SITE_REVISION: ${{ github.sha }}
      - name: Verify live website
        run: python website/verify.py
        env:
          SITE_REVISION: ${{ github.sha }}
