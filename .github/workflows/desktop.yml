name: Desktop

on:
  pull_request:
    paths-ignore: ["website/**", ".github/workflows/website.yml"]
  push:
    branches: [main]
    paths-ignore: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      # Unit tests do not launch Electron; acceptance suites stay local.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      # Windows checkouts convert line endings, which Prettier reports.
      - run: npx prettier --check src tests
        if: runner.os != 'Windows'
      - run: npm test
